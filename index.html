<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Felipe — Biografia</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 28px 16px;
font-family: Arial, Helvetica, sans-serif;
color: #fff;
overflow-x: hidden;
background: #111;
}

/* GIF de fundo, cobrindo e se adaptando a qualquer tela */
body::before {
content: "";
position: fixed;
inset: -30px;
z-index: -2;
background:
url("https://i.ibb.co/39x5QGvY/c8d5c5b175984bb17b4172c5c34343eb.gif")
center center / cover no-repeat;
filter: blur(10px);
transform: scale(1.06);
}

/* Escurece levemente o fundo para o conteúdo ficar legível */
body::after {
content: "";
position: fixed;
inset: 0;
z-index: -1;
background: rgba(0,0,0,.28);
pointer-events: none;
}

.card {
width: min(460px, 100%);
padding: 34px 22px 26px;
text-align: center;
border: 1px solid rgba(255,255,255,.20);
border-radius: 28px;
background: rgba(15,15,18,.30);
backdrop-filter: blur(18px) saturate(120%);
-webkit-backdrop-filter: blur(18px) saturate(120%);
box-shadow:
0 20px 70px rgba(0,0,0,.42),
inset 0 1px 0 rgba(255,255,255,.12);
}

.avatar {
width: 128px;
height: 128px;
margin: 0 auto 17px;
display: block;
object-fit: cover;
border-radius: 27px;
border: 2px solid rgba(255,255,255,.35);
box-shadow: 0 12px 35px rgba(0,0,0,.38);
}

.username {
margin: 0;
font-size: 27px;
line-height: 1.15;
font-weight: 800;
text-shadow: 0 3px 15px rgba(0,0,0,.45);
}

.bio {
margin: 14px 0 26px;
font-size: 17px;
line-height: 1.5;
font-weight: 600;
text-shadow: 0 2px 12px rgba(0,0,0,.45);
white-space: pre-line;
}

.servers {
display: flex;
flex-direction: column;
gap: 12px;
}

.server {
position: relative;
min-height: 72px;
display: flex;
align-items: center;
gap: 14px;
padding: 10px 18px 10px 10px;
color: #fff;
text-decoration: none;
border-radius: 18px;
border: 1px solid rgba(255,255,255,.16);
background: rgba(255,255,255,.10);
box-shadow: 0 8px 25px rgba(0,0,0,.18);
transition: transform .2s ease, background .2s ease, border-color .2s ease;
overflow: hidden;
}

.server:hover {
transform: translateY(-2px) scale(1.01);
background: rgba(255,255,255,.16);
border-color: rgba(255,255,255,.30);
}

.server:active { transform: scale(.985); }

.server img {
width: 52px;
height: 52px;
flex: 0 0 52px;
object-fit: cover;
border-radius: 13px;
border: 1px solid rgba(255,255,255,.22);
}

.server-name {
flex: 1;
text-align: center;
padding-right: 52px;
font-size: 16px;
font-weight: 800;
letter-spacing: .1px;
}

.arrow {
position: absolute;
right: 17px;
font-size: 20px;
opacity: .65;
}

.footer {
margin-top: 19px;
font-size: 11px;
opacity: .48;
letter-spacing: .3px;
}

@media (max-width: 420px) {
.card { padding: 29px 15px 22px; border-radius: 24px; }
.avatar { width: 112px; height: 112px; border-radius: 24px; }
.username { font-size: 25px; }
.bio { font-size: 16px; }
.server-name { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
.server { transition: none; }
}
</style>
</head>
<body>
<main class="card">
<img
class="avatar"
src="https://i.ibb.co/nqrNWgkx/c8d2d6fe5f80ae5000e631999fadab50.gif"
alt="Foto de perfil de Felipe"
>

<h1 class="username">@𝐅𝐞𝐥𝐢𝐩𝐞</h1>

<div class="bio">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹
𝐌𝐨𝐫𝐩𝐡 𝐦𝐚𝐤𝐞𝐫⋆𝐬𝐜𝐫𝐢𝐩𝐭𝐞𝐫</div>

<section class="servers" aria-label="Servidores do Discord">
<a class="server" href="https://discord.gg/HxPgsYWUJZ" target="_blank" rel="noopener noreferrer">
<img src="https://i.ibb.co/fzF4JdR5/29c902c2c65758f8f9fd468d3f24d8e0.jpg" alt="">
<span class="server-name">Fefe Comms</span>
<span class="arrow">›</span>
</a>

<a class="server" href="https://discord.gg/U6MK5xQFMn" target="_blank" rel="noopener noreferrer">
<img src="https://i.ibb.co/Ngp1h2Wt/Picsart-26-09-13-15-11-08-651.jpg" alt="">
<span class="server-name">New Multiverse Adventure</span>
<span class="arrow">›</span>
</a>
</section>

<div class="footer">© Felipe</div>
</main>
</body>
</html>
